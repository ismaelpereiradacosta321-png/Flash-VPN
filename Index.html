<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flash VPN</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">


<div class="logo">
<h1>⚡ Flash VPN</h1>
<p>Internet rápida e segura</p>
</div>



<div class="card">

<h2>Status da Conexão</h2>

<div class="status">

<div id="luz"></div>

<p id="status">
Desconectado
</p>

</div>


<button id="conectar">
CONECTAR
</button>


<button id="desconectar">
DESCONECTAR
</button>


</div>





<div class="card">


<h2>Escolha sua Operadora</h2>


<select id="operadora" class="menu">

<option>TIM</option>

<option>Vivo</option>

<option>Claro</option>

<option>Outros</option>

</select>


</div>






<div class="card">


<h2>Servidores VPN</h2>


<select id="servidor" class="menu">


<option>🇧🇷 Brasil</option>

<option>🇺🇸 Estados Unidos</option>

<option>🇯🇵 Japão</option>

<option>🇩🇪 Alemanha</option>

<option>🇸🇬 Singapura</option>


</select>


</div>






<div class="card">


<h2>Plano</h2>


<p>
Assinatura: 30 dias
</p>


<p>
Horas disponíveis: Controle automático
</p>


<button>
RENOVAR PLANO
</button>


</div>







<div class="card">


<h2>Contato e Feedback</h2>


<p>
WhatsApp
</p>


<p>
Telegram
</p>


<p>
Email
</p>


</div>



</div>



<script src="script.js"></script>

</body>

</html>
